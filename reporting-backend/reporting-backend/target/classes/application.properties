# ============================
# Serveur
# ============================
server.port=8080
spring.application.name=reporting-backend

# ============================
# Base de donnees H2 (en memoire - pour developpement) - DESACTIVEE
# ============================
#spring.datasource.url=jdbc:h2:mem:reporting_db
#spring.datasource.driver-class-name=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=
#spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Console H2
#spring.h2.console.enabled=true
#spring.h2.console.path=/h2-console

# ============================
# CONFIGURATION MYSQL (ACTIVEE)
# ============================
spring.datasource.url=jdbc:mysql://localhost:3306/reporting_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Configuration JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================
# Flyway (migrations versionnees) - DESACTIVE EN DEV
# ============================
# En developpement on garde ddl-auto=update pour la simplicite (voir ci-dessus).
# En production (profil "prod"), Flyway est active et ddl-auto passe a "validate"
# (voir application-prod.properties) : c'est Flyway, pas Hibernate, qui cree/modifie
# le schema, a partir des scripts de src/main/resources/db/migration.
spring.flyway.enabled=false

# ============================
# Upload de fichiers Excel
# ============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
app.upload.dir=uploads
app.reports.dir=generated-reports

# ============================
# Photos de profil utilisateurs (NOUVEAU)
# ============================
app.upload.photos-dir=profile-photos
spring.servlet.multipart.max-file-size=20MB

# ============================
# JWT
# ============================
app.jwt.secret=ChangeMeToASecretKeyOfAtLeast256BitsForHS256Algorithm123456
app.jwt.expiration-ms=86400000
# Refresh token : 7 jours (604800000 ms)
app.jwt.refresh-expiration-ms=604800000

# ============================
# Email (Spring Mail) - a completer avec les vrais identifiants SMTP
# ============================
# ATTENTION : ces valeurs par defaut sont des placeholders. C'est la cause la plus
# probable si "l'envoi de rapport par email ne fonctionne pas". Deux options :
#   1) Remplacer CHANGE_ME ci-dessous par un vrai compte SMTP avant de démarrer le backend.
#      Pour Gmail : il faut un "mot de passe d'application" (compte Google > Sécurité >
#      validation en 2 étapes > mots de passe des applications), le mot de passe normal
#      du compte ne fonctionnera pas.
#   2) Ou bien laisser ces valeurs telles quelles et configurer le SMTP depuis
#      l'application (Paramètres > Configuration SMTP, réservé aux administrateurs) :
#      depuis la version corrigée, ces valeurs enregistrées en base sont prioritaires
#      et prennent le dessus sur celles-ci au moment de l'envoi (voir EmailService).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=CHANGE_ME@example.com
spring.mail.password=CHANGE_ME
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ============================
# Planification des rapports (cron par defaut : tous les jours a 08:00)
# ============================
app.scheduler.daily-report-cron=0 0 8 * * *