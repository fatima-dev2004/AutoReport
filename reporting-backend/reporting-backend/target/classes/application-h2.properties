# ============================
# Serveur
# ============================
server.port=8080
spring.application.name=reporting-backend

# ============================
# Base de donnees H2 (en memoire - pour developpement)
# ============================
spring.datasource.url=jdbc:h2:mem:reporting_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Console H2 (accessible via http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================
# Upload de fichiers Excel
# ============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
app.upload.dir=uploads
app.reports.dir=generated-reports

# ============================
# JWT
# ============================
app.jwt.secret=ChangeMeToASecretKeyOfAtLeast256BitsForHS256Algorithm123456
app.jwt.expiration-ms=86400000

# ============================
# Email (Spring Mail) - a completer avec les vrais identifiants SMTP
# ============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=CHANGE_ME@example.com
spring.mail.password=CHANGE_ME
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ============================
# Planification des rapports (cron par defaut : tous les jours a 08:00)
# ============================
app.scheduler.daily-report-cron=0 0 8 * * *
