# ============================
# CONFIGURATION PRODUCTION
# ============================
# Ce fichier contient la configuration pour l'environnement de production.
# IMPORTANT : Ne jamais commiter ce fichier avec des credentials réels !
# Utiliser des variables d'environnement ou un vault de secrets.

server.port=${SERVER_PORT:8080}
spring.application.name=reporting-backend

# ============================
# Base de données PRODUCTION
# ============================
# UTILISER DES VARIABLES D'ENVIRONNEMENT
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/reporting_db?useSSL=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Configuration JPA/Hibernate - PRODUCTION
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ============================
# Flyway - migrations versionnees (remplace ddl-auto=update)
# ============================
# C'est Flyway qui cree/modifie le schema en production, a partir des scripts
# de src/main/resources/db/migration. Hibernate ne fait que "valide" (verifie
# que le schema correspond aux entites, sans jamais le modifier).
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.user=${DB_USERNAME}
spring.flyway.password=${DB_PASSWORD}
spring.flyway.url=${DB_URL:jdbc:mysql://localhost:3306/reporting_db?useSSL=true&serverTimezone=UTC}

# Pool de connexions (HikariCP)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ============================
# Upload de fichiers
# ============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
app.upload.dir=${UPLOAD_DIR:/var/app/uploads}
app.reports.dir=${REPORTS_DIR:/var/app/reports}
app.upload.photos-dir=${PHOTOS_DIR:/var/app/photos}

# ============================
# JWT - PRODUCTION
# ============================
# CRITIQUE : Utiliser une clé secrète forte et unique en production
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION:3600000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION:604800000}

# ============================
# Email (SMTP) - PRODUCTION
# ============================
# UTILISER DES VARIABLES D'ENVIRONNEMENT
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${SMTP_HOST}

# ============================
# Logging - PRODUCTION
# ============================
logging.level.root=WARN
logging.level.com.sews.reporting=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.file.name=${LOG_FILE:/var/log/reporting-backend/application.log}
logging.file.max-size=10MB
logging.file.max-history=30

# ============================
# Actuator - PRODUCTION (Sécurisé)
# ============================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.metrics.export.prometheus.enabled=true

# ============================
# Sécurité
# ============================
# HTTPS obligatoire en production
server.ssl.enabled=${SSL_ENABLED:true}
server.ssl.key-store=${SSL_KEYSTORE:/etc/ssl/keystore.p12}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
server.ssl.key-store-type=PKCS12

# Headers de sécurité
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# ============================
# Documentation API (Swagger UI)
# ============================
# Desactivee par defaut en production (surface d'attaque publique inutile).
# Activer temporairement via la variable d'environnement SWAGGER_ENABLED=true si besoin.
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}

# ============================
# Planification
# ============================
app.scheduler.daily-report-cron=${SCHEDULER_CRON:0 0 8 * * *}
