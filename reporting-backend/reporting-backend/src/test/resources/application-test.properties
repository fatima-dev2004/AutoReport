# Configuration pour les tests
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT Configuration pour tests
app.jwt.secret=MyVerySecretKeyForTestingPurposesOnlyThisIsALongSecretKey12345
app.jwt.expiration-ms=3600000

# Désactiver l'envoi d'emails en test
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test
spring.mail.password=test

# Répertoire temporaire pour les rapports
app.reports.dir=target/test-reports

# Désactiver la console H2 en test
spring.h2.console.enabled=false

# Logging
logging.level.com.sews.reporting=DEBUG
logging.level.org.springframework.security=DEBUG
