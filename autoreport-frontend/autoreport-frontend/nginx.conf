server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Routing SPA : toute route inconnue renvoie index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache long pour les assets buildes (noms hashes par Vite)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
